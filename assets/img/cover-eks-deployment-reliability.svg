<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-label="A new release moving through canary and full rollout stages, with automatic rollback if checks fail"><rect width="480" height="320" fill="#9a5f4a"/><g font-family="-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle"><rect x="24" y="44" width="120" height="72" rx="10" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/><text x="84" y="77" fill="#fff" font-size="17" font-weight="600">Canary</text><text x="84" y="97" fill="#fff" opacity=".8" font-size="14">small share</text><path d="M144 80h24" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" fill="none"/><path d="M168 75l8 5-8 5z" fill="#fff" fill-opacity=".8"/><rect x="176" y="44" width="120" height="72" rx="10" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.65)" stroke-width="1.5"/><text x="236" y="77" fill="#fff" font-size="17" font-weight="600">Checks</text><text x="236" y="97" fill="#fff" opacity=".8" font-size="14">errors, latency</text><path d="M296 80h24" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" fill="none"/><path d="M320 75l8 5-8 5z" fill="#fff" fill-opacity=".8"/><rect x="328" y="44" width="128" height="72" rx="10" fill="#f4f2ee" stroke="#f4f2ee" stroke-width="1.5"/><text x="392" y="77" fill="#1a1917" font-size="17" font-weight="600">Full release</text><text x="392" y="97" fill="#1a1917" opacity=".8" font-size="14">all traffic</text><path d="M236 116v40H84v-26" stroke="#f4f2ee" stroke-width="1.5" stroke-dasharray="5 5" fill="none"/><path d="M79 130l5-8 5 8z" fill="#f4f2ee"/><text x="160" y="148" fill="#fff" font-size="14">roll back on failure</text><rect x="24" y="178" width="432" height="116" rx="10" fill="rgba(0,0,0,.14)"/><text x="240" y="204" fill="#fff" font-size="14" opacity=".9">EKS cluster: new version pods added in stages</text><rect x="52" y="222" width="30" height="24" rx="5" fill="#f4f2ee"/><rect x="91" y="222" width