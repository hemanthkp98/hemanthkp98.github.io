<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Hemanth K P</title>
  <meta name="description" content="This page does not exist.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1917'/%3E%3Cpath fill='%23f4f2ee' d='M9 7h4v7h6V7h4v18h-4v-7h-6v7H9z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&amp;display=swap">
  <!-- GitHub Pages serves this file at any missing path, so relative asset links would break. Styles are inline. -->
  <style>
    :root { color-scheme: light dark; --bg: #f4f2ee; --text: #1a1917; --accent: #c0603e; --link: #1a1917; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161513; --text: #f4f2ee; --accent: #e58d68; --link: #f4f2ee; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1.0625rem/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
    main { max-width: 720px; margin: 0 auto; padding: 7rem 1rem; }
    h1 { font: 400 clamp(2.5rem, 7vw, 4.25rem)/1.12 "Fraunces", Georgia, serif; letter-spacing: -0.025em; margin: 0 0 1.25rem; }
    h1 span { color: var(--accent); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Page <span>not found.</span></h1>
    <p>This page does not exist. <a id="home" href="/">Go to the home page</a>.</p>
  </main>
  <script>
    // On a project site, home is /<repo>/ rather than /. Checks for the stylesheet to tell which one this is.
    var segment = location.pathname.split('/')[1];
    if (segment) {
      fetch('/' + segment + '/assets/css/style.css', { method: 'HEAD' }).then(function (response) {
        if (response.ok) document.getElementById('home').href = '/' + segment + '/';
      });
    }
  </script>
</body>
</html>
